name: Workspace checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: missionism_ci
          POSTGRES_PASSWORD: missionism_ci
          POSTGRES_DB: workspace_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U missionism_ci -d workspace_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Build staging configuration
        run: npm run build
        env:
          WORKSPACE_RELEASE_TARGET: staging
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: missionism-ci-staging
          NEXT_PUBLIC_FIREBASE_API_KEY: example-public-firebase-key-value
          FIREBASE_PROJECT_ID: missionism-ci-staging
      - name: Migrate disposable PostgreSQL database
        run: npm run workspace:migrate
        env:
          WORKSPACE_MIGRATION_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/workspace_check
      - name: Bind staging database
        run: npm run workspace:bind-environment
        env:
          WORKSPACE_RELEASE_TARGET: staging
          WORKSPACE_EXPECTED_DATABASE_NAME: workspace_check
          WORKSPACE_EXPECTED_FIREBASE_PROJECT_ID: missionism-ci-staging
          WORKSPACE_MIGRATION_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/workspace_check
      - name: Grant restricted runtime role
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U missionism_ci -d workspace_check -v ON_ERROR_STOP=1 -c "CREATE ROLE missionism_ci_runtime LOGIN PASSWORD 'missionism_ci_runtime'"
          docker exec -i "${{ job.services.postgres.id }}" psql -U missionism_ci -d workspace_check -v ON_ERROR_STOP=1 -v app_role=missionism_ci_runtime < scripts/workspace-runtime-grants.sql
      - name: Verify restricted role and customer workflow
        env:
          DATABASE_URL: postgresql://missionism_ci_runtime:missionism_ci_runtime@localhost:5432/workspace_check
          WORKSPACE_TEST_DATABASE_URL: postgresql://missionism_ci_runtime:missionism_ci_runtime@localhost:5432/workspace_check
          WORKSPACE_TEST_MIGRATION_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/workspace_check
        run: |
          npm run workspace:check-runtime-role
          npm run workspace:pg-smoke
          npm run workspace:check-audit
      - name: Restore a logical backup into a second database
        run: |
          docker exec "${{ job.services.postgres.id }}" pg_dump -Fc -U missionism_ci -d workspace_check > /tmp/missionism-workspace-ci.dump
          docker exec "${{ job.services.postgres.id }}" createdb -U missionism_ci workspace_restore_check
          docker exec -i "${{ job.services.postgres.id }}" pg_restore --no-owner --no-acl --exit-on-error -U missionism_ci -d workspace_restore_check < /tmp/missionism-workspace-ci.dump
      - name: Verify restored records and audit
        env:
          WORKSPACE_TEST_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/workspace_check
          WORKSPACE_RESTORE_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/workspace_restore_check
          DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/workspace_restore_check
        run: |
          npm run workspace:restore-check
          npm run workspace:check-audit
      - name: Migrate disposable Mission database
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U missionism_ci mission_check
          npm run mission:migrate
        env:
          MISSION_MIGRATION_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/mission_check
      - name: Bind staging Mission database
        run: npm run mission:bind-environment
        env:
          MISSION_RELEASE_TARGET: staging
          MISSION_EXPECTED_DATABASE_NAME: mission_check
          MISSION_EXPECTED_FIREBASE_PROJECT_ID: missionism-ci-staging
          MISSION_EXPECTED_INSTANCE: pct-99:us-central1:pct99-missions-ci
          MISSION_MIGRATION_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/mission_check
      - name: Grant restricted Mission runtime role
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U missionism_ci -d mission_check -v ON_ERROR_STOP=1 -c "CREATE ROLE mission_ci_runtime LOGIN PASSWORD 'mission_ci_runtime'"
          docker exec -i "${{ job.services.postgres.id }}" psql -U missionism_ci -d mission_check -v ON_ERROR_STOP=1 -v app_role=mission_ci_runtime < scripts/mission-runtime-grants.sql
      - name: Verify Mission runtime role and smoke
        env:
          MISSION_RUNTIME_DATABASE_URL: postgresql://mission_ci_runtime:mission_ci_runtime@localhost:5432/mission_check
        run: |
          npm run mission:check-runtime-role
          npm run mission:pg-smoke
      - name: Restore a Mission logical backup into a second database
        run: |
          docker exec "${{ job.services.postgres.id }}" pg_dump -Fc -U missionism_ci -d mission_check > /tmp/pct99-missions-ci.dump
          docker exec "${{ job.services.postgres.id }}" createdb -U missionism_ci mission_restore_check
          docker exec -i "${{ job.services.postgres.id }}" pg_restore --no-owner --no-acl --exit-on-error -U missionism_ci -d mission_restore_check < /tmp/pct99-missions-ci.dump
      - name: Verify restored Mission records
        env:
          MISSION_TEST_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/mission_check
          MISSION_RESTORE_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/mission_restore_check
        run: npm run mission:restore-check
      - name: Migrate disposable economic database
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U missionism_ci economic_check
          npm run economy:migrate
        env:
          ECONOMIC_MIGRATION_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/economic_check
      - name: Grant economic runtime and verifier roles
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U missionism_ci -d economic_check -v ON_ERROR_STOP=1 -c "CREATE ROLE economic_ci_runtime LOGIN PASSWORD 'economic_ci_runtime'"
          docker exec "${{ job.services.postgres.id }}" psql -U missionism_ci -d economic_check -v ON_ERROR_STOP=1 -c "CREATE ROLE economic_ci_kernel LOGIN PASSWORD 'economic_ci_kernel'"
          docker exec "${{ job.services.postgres.id }}" psql -U missionism_ci -d economic_check -v ON_ERROR_STOP=1 -c "CREATE ROLE economic_ci_verifier LOGIN PASSWORD 'economic_ci_verifier'"
          docker exec -i "${{ job.services.postgres.id }}" psql -U missionism_ci -d economic_check -v ON_ERROR_STOP=1 -v app_role=economic_ci_runtime < scripts/economic-runtime-grants.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U missionism_ci -d economic_check -v ON_ERROR_STOP=1 -v app_role=economic_ci_kernel < scripts/economic-kernel-grants.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U missionism_ci -d economic_check -v ON_ERROR_STOP=1 -v app_role=economic_ci_verifier < scripts/economic-verifier-grants.sql
      - name: Verify economic roles and concurrent rewards
        env:
          ECONOMIC_MIGRATION_DATABASE_URL: postgresql://missionism_ci:missionism_ci@localhost:5432/economic_check
          ECONOMIC_RUNTIME_DATABASE_URL: postgresql://economic_ci_runtime:economic_ci_runtime@localhost:5432/economic_check
          ECONOMIC_KERNEL_DATABASE_URL: postgresql://economic_ci_kernel:economic_ci_kernel@localhost:5432/economic_check
          ECONOMIC_VERIFIER_DATABASE_URL: postgresql://economic_ci_verifier:economic_ci_verifier@localhost:5432/economic_check
        run: |
          npm run economy:check-runtime-role
          npm run economy:pg

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: node --test scripts/check-npm-audit.test.mjs
      - run: npm run check:npm-audit
